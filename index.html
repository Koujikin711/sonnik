<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sonnik/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a4a" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('sonnik.theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.style.colorScheme = 'dark'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0f161a')
          }
        } catch (e) {}
      })()
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="description" content="Сонник — толкование снов по разным традициям" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Сонник" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/sonnik/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/sonnik/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;1,14..32,400&display=swap" rel="stylesheet" />
    <title>Сонник</title>
    <script type="module" crossorigin src="/sonnik/assets/index-AAkOUTxf.js"></script>
    <link rel="stylesheet" crossorigin href="/sonnik/assets/index-DhsVc3c9.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var BUILD = '0.2.50'
        try {
          if (window.caches) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k) }))
            })
          }
          if (localStorage.getItem('sonnik-build') !== BUILD) {
            localStorage.setItem('sonnik-build', BUILD)
            sessionStorage.removeItem('sonnik-v')
          }
        } catch (e) {}
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.getRegistration('/sonnik/').then(function (reg) {
          if (reg || navigator.serviceWorker.controller) {
            return navigator.serviceWorker.register('/sonnik/sw.js')
          }
        }).catch(function () {})
      })()
    </script>
  </body>
</html>
